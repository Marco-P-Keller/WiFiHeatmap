name: WiFiHeatmap
options:
  bundleIdPrefix: com.connexa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: B97SQSQBMR
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
targets:
  WiFiHeatmap:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      - path: PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connexa.WiFiHeatmap
        PRODUCT_NAME: WiFiHeatmap
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: WiFiHeatmap.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "WiFi Heatmap"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCameraUsageDescription: "The camera shows your room in AR so the Wi-Fi heatmap can be drawn on your floor. Nothing is recorded or uploaded."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "iOS requires Location access to read your Wi-Fi signal strength. Your location is never stored or shared."
    scheme:
      storeKitConfiguration: WiFiHeatmap.storekit
